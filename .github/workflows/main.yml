name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4

      
uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

      # Installs a Gradle new enough for Loom 1.17 (the runner's built-in 9.5 may be too old).
      
uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.6.0

      
run: gradle build

      # If the build fails, print the real method names so the errors can be fixed exactly.
      
name: Dump API signatures
      if: failure()
      run: |
        for j in $(find ~/.gradle/caches -name '*.jar' -size +10M 2>/dev/null); do
          for c in net.minecraft.client.Minecraft net.minecraft.client.gui.Gui net.minecraft.world.entity.player.Player net.minecraft.client.player.LocalPlayer net.minecraft.client.gui.components.ChatComponent net.minecraft.world.level.block.Blocks net.minecraft.world.level.block.WeatheringCopperCollection; do
            OUT=$(javap -public -cp "$j" "$c" 2>/dev/null) || continue
            echo "=== $c ($j)"
            case "$c" in*Blocks) echo "$OUT" | grep -i copper | head -20 ;;*WeatheringCopperCollection) echo "$OUT" ;;*) echo "$OUT" | grep -iE 'screen|connection|gui|overlay|message|chat|actionbar' | head -40 ;;
            esac
          done
        done

      
uses: actions/upload-artifact@v4
      with:
        name: copper-storage-jar
        path: build/libs/*.jar
